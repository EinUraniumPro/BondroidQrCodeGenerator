name: CI-Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore BondroidQrGenerator.slnx

      - name: Build solution
        run: dotnet build BondroidQrGenerator.slnx --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test BondroidQrGenerator.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**/*.trx'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    strategy:
      matrix:
        rid:
          - win-x64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent binary
        run: >
          dotnet publish BondroidQrGenerator/BondroidQrGenerator.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --output publish/${{ matrix.rid }}
          -p:PublishSingleFile=true

      - name: Upload published artifact
        uses: actions/upload-artifact@v7
        with:
          name: bondroid-qr-generator-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Download all published artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bondroid-qr-generator-*
          path: artifacts

      - name: Zip artifacts per platform
        run: |
          cd artifacts
          for dir in */; do
            rid="${dir%/}"
            zip -r "../${rid}.zip" "$dir"
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: "*.zip"
